<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 768" width="512" height="768">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1a16"/>
      <stop offset="0.5" stop-color="#132822"/>
      <stop offset="1" stop-color="#070f0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.55" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#3f6b58" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0a1411" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.92"/>
    </radialGradient>
    <radialGradient id="burn" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2a1a0c" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#4a3015" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5a3c1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b5530" stop-opacity="0.8"/>
      <stop offset="0.7" stop-color="#4a3a1e" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#3a2c14" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.7  0 0 0 0 0.6  0 0 0 0.35 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="fog" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="4" seed="3" result="f"/>
      <feColorMatrix in="f" type="matrix" values="0 0 0 0 0.6  0 0 0 0 0.72  0 0 0 0 0.66  0 0 0 0.9 -0.25"/>
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="3" seed="11" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="22" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="smudge">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="21" result="s"/>
      <feDisplacementMap in="SourceGraphic" in2="s" scale="8"/>
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <clipPath id="pane"><rect x="56" y="70" width="400" height="628" rx="10"/></clipPath>
  </defs>

  <rect width="512" height="768" fill="url(#bg)"/>

  <!-- frame -->
  <rect x="30" y="44" width="452" height="680" rx="16" fill="#101a17" stroke="#26342f" stroke-width="3"/>
  <rect x="48" y="62" width="416" height="644" rx="12" fill="#0a1310" stroke="#3a4a42" stroke-width="2"/>
  <g fill="#2b3833" stroke="#0a110e" stroke-width="1.5">
    <circle cx="44" cy="58" r="6"/><circle cx="468" cy="58" r="6"/>
    <circle cx="44" cy="710" r="6"/><circle cx="468" cy="710" r="6"/>
    <circle cx="44" cy="384" r="6"/><circle cx="468" cy="384" r="6"/>
  </g>

  <g clip-path="url(#pane)">
    <!-- empty chamber beyond -->
    <rect x="56" y="70" width="400" height="628" fill="#0d1c17"/>
    <rect x="56" y="70" width="400" height="628" fill="url(#glow)"/>
    <g stroke="#1c2e27" stroke-width="2" opacity="0.7">
      <line x1="56" y1="520" x2="456" y2="500"/>
      <line x1="150" y1="70" x2="170" y2="510"/>
      <line x1="360" y1="70" x2="350" y2="505"/>
    </g>
    <rect x="200" y="300" width="110" height="200" fill="#0a1512" opacity="0.8"/>

    <!-- fog -->
    <rect x="56" y="70" width="400" height="628" filter="url(#fog)" opacity="0.75"/>

    <!-- burn marks -->
    <g filter="url(#rough)">
      <ellipse cx="110" cy="140" rx="90" ry="70" fill="url(#burn)"/>
      <ellipse cx="400" cy="620" rx="100" ry="80" fill="url(#burn)"/>
      <ellipse cx="380" cy="180" rx="50" ry="40" fill="url(#burn)" opacity="0.7"/>
      <ellipse cx="90" cy="560" rx="60" ry="45" fill="url(#burn)" opacity="0.6"/>
    </g>

    <!-- dried residue drips -->
    <g filter="url(#smudge)" fill="url(#drip)">
      <path d="M120 180 q6 -4 12 0 l-2 160 q-4 12 -8 0 z"/>
      <path d="M150 200 q5 -3 9 0 l-1 90 q-3 9 -7 0 z"/>
      <path d="M232 120 q8 -6 16 0 l-3 260 q-5 16 -10 0 z"/>
      <path d="M262 140 q4 -3 8 0 l-2 120 q-3 8 -5 0 z"/>
      <path d="M330 210 q7 -4 13 0 l-2 210 q-5 14 -9 0 z"/>
      <path d="M372 230 q4 -2 7 0 l-1 70 q-2 7 -5 0 z"/>
      <path d="M190 400 q6 -4 11 0 l-2 180 q-4 12 -8 0 z"/>
      <path d="M290 430 q5 -3 10 0 l-2 140 q-3 10 -7 0 z"/>
      <path d="M100 110 Q260 96 420 120 L420 132 Q260 112 100 128 Z" opacity="0.7"/>
    </g>
    <g fill="#2a2010" opacity="0.6">
      <circle cx="126" cy="342" r="4"/><circle cx="240" cy="382" r="5"/>
      <circle cx="336" cy="422" r="4"/><circle cx="195" cy="582" r="4"/>
      <circle cx="295" cy="572" r="3"/>
    </g>

    <!-- wiped streak / condensation beads -->
    <path d="M70 460 Q250 420 440 470" stroke="#5f8a78" stroke-width="18" fill="none" opacity="0.08"/>
    <g fill="#9fbfb0" opacity="0.18">
      <circle cx="90" cy="300" r="2"/><circle cx="310" cy="160" r="1.5"/>
      <circle cx="420" cy="360" r="2.5"/><circle cx="170" cy="640" r="2"/>
      <circle cx="350" cy="520" r="1.5"/><circle cx="210" cy="250" r="1.8"/>
    </g>

    <!-- scratches -->
    <g stroke="#8aa89a" stroke-width="0.6" opacity="0.2">
      <line x1="80" y1="420" x2="200" y2="380"/>
      <line x1="300" y1="660" x2="440" y2="600"/>
      <line x1="260" y1="90" x2="330" y2="150"/>
    </g>

    <!-- glass sheen -->
    <path d="M56 70 L200 70 L56 300 Z" fill="#b8d8c8" opacity="0.05"/>
  </g>

  <!-- grain -->
  <rect width="512" height="768" fill="#fff" filter="url(#grain)" opacity="0.55"/>
  <!-- green tint + vignette -->
  <rect width="512" height="768" fill="#0f2a1e" opacity="0.25" style="mix-blend-mode:multiply"/>
  <rect width="512" height="768" fill="url(#vig)"/>
</svg>