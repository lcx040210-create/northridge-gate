  </g>

  <!-- 定格感：整体帧位闪跳 + 帧间曝光闪烁 -->
  <g id="stopMotionFrame">
    <animateTransform attributeName="transform" type="translate" dur="0.66s" calcMode="discrete"
      repeatCount="indefinite" values="0 0;1.5 -1;-1 0.5;0.5 1.5;-1.5 -0.5;0 0"/>
    <rect width="100%" height="100%" fill="#000" opacity="0">
      <animate attributeName="opacity" dur="0.66s" calcMode="discrete" repeatCount="indefinite"
        values="0;0.06;0;0.1;0;0.04"/>
    </rect>
    <!-- 胶片刮痕 -->
    <line x1="230" y1="0" x2="232" y2="100%" stroke="#e8d6d6" stroke-width="0.8" opacity="0">
      <animate attributeName="opacity" dur="1.3s" calcMode="discrete" repeatCount="indefinite" values="0;0.3;0;0;0.15;0"/>
    </line>
    <line x1="710" y1="0" x2="707" y2="100%" stroke="#e8d6d6" stroke-width="0.6" opacity="0">
      <animate attributeName="opacity" dur="0.9s" calcMode="discrete" repeatCount="indefinite" values="0;0;0.25;0"/>
    </line>
  </g>

  <!-- 暗红血雾层 -->
  <g id="bloodMist" style="mix-blend-mode:multiply">
    <rect x="-10%" y="40%" width="120%" height="70%" fill="url(#mistGradEnd)" filter="url(#mistBlurEnd)">
      <animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite"
        values="0 0;-30 -8;0 0"/>
    </rect>
    <rect width="100%" height="100%" fill="#4a0008" opacity="0.18"/>
  </g>

  <!-- grain 颗粒 -->
  <rect width="100%" height="100%" filter="url(#grainEnd)" style="mix-blend-mode:overlay" pointer-events="none"/>

  <!-- 暗角 -->
  <rect width="100%" height="100%" fill="url(#vignetteEnd)" pointer-events="none"/>
</svg>