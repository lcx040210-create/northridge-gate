<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 768" width="512" height="768">
```svg

  <defs>
    <!-- 背景：冷绿暗调，底部沉入黑 -->
    <radialGradient id="bg" cx="50%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#2a3a33"/>
      <stop offset="28%" stop-color="#1c2a24"/>
      <stop offset="55%" stop-color="#121c18"/>
      <stop offset="80%" stop-color="#0a110e"/>
      <stop offset="100%" stop-color="#050807"/>
    </radialGradient>

    <!-- 顶光：头顶一盏病态绿白灯 -->
    <radialGradient id="topLight" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#d8f0e0" stop-opacity="0.55"/>
      <stop offset="18%" stop-color="#a9cdb6" stop-opacity="0.32"/>
      <stop offset="42%" stop-color="#6f9a82" stop-opacity="0.14"/>
      <stop offset="70%" stop-color="#3b5a4a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#1a2a22" stop-opacity="0"/>
    </radialGradient>

    <!-- 脸：苍白、略带青灰 -->
    <radialGradient id="face" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#e6e2d6"/>
      <stop offset="25%" stop-color="#d3d2c4"/>
      <stop offset="50%" stop-color="#b7bcac"/>
      <stop offset="75%" stop-color="#8e9888"/>
      <stop offset="92%" stop-color="#5f6c60"/>
      <stop offset="100%" stop-color="#3c463e"/>
    </radialGradient>

    <!-- 额头高光 -->
    <radialGradient id="forehead" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f4f2e8" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#dfe0d2" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#bfc6b6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#9aa596" stop-opacity="0"/>
    </radialGradient>

    <!-- 眼窝：深陷青紫阴影 -->
    <radialGradient id="socket" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#3a3a3c" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#4a4f4a" stop-opacity="0.6"/>
      <stop offset="65%" stop-color="#6b756a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8e9888" stop-opacity="0"/>
    </radialGradient>

    <!-- 脸颊：极淡的暗红血色 -->
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a4a44" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#7a4640" stop-opacity="0.16"/>
      <stop offset="75%" stop-color="#6a4a44" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#5a4a44" stop-opacity="0"/>
    </radialGradient>

    <!-- 通用侧影 -->
    <linearGradient id="shade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a100d" stop-opacity="0.75"/>
      <stop offset="18%" stop-color="#1a2420" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#2a3530" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#2a3530" stop-opacity="0.08"/>
      <stop offset="82%" stop-color="#1a2420" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0a100d" stop-opacity="0.8"/>
    </linearGradient>

    <!-- 眼白：灰黄、不健康 -->
    <radialGradient id="eyeW" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#dcdccf"/>
      <stop offset="45%" stop-color="#c2c4b4"/>
      <stop offset="80%" stop-color="#8f9486"/>
      <stop offset="100%" stop-color="#5c6258"/>
    </radialGradient>

    <!-- 虹膜：浑浊灰绿 -->
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c0f0d"/>
      <stop offset="28%" stop-color="#1a211c"/>
      <stop offset="45%" stop-color="#4f6454"/>
      <stop offset="70%" stop-color="#6f8672"/>
      <stop offset="90%" stop-color="#3a4a3e"/>
      <stop offset="100%" stop-color="#1c2420"/>
    </radialGradient>

    <!-- 脖子：比脸更暗 -->
    <linearGradient id="neck" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d463e"/>
      <stop offset="22%" stop-color="#7e8a7c"/>
      <stop offset="50%" stop-color="#a7ae9e"/>
      <stop offset="78%" stop-color="#78847a"/>
      <stop offset="100%" stop-color="#343d36"/>
    </linearGradient>

    <!-- 制服：深墨绿近黑 -->
    <linearGradient id="suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b3832"/>
      <stop offset="25%" stop-color="#1f2a25"/>
      <stop offset="55%" stop-color="#151e1a"/>
      <stop offset="80%" stop-color="#0d1411"/>
      <stop offset="100%" stop-color="#060a08"/>
    </linearGradient>

    <!-- 软帽 -->
    <linearGradient id="helmet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3e4c44"/>
      <stop offset="30%" stop-color="#2a3630"/>
      <stop offset="65%" stop-color="#1a231f"/>
      <stop offset="100%" stop-color="#0b100e"/>
    </linearGradient>

    <!-- 嘴唇：灰紫带暗红 -->
    <linearGradient id="lip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6e4a48"/>
      <stop offset="45%" stop-color="#7c5652"/>
      <stop offset="75%" stop-color="#5e4240"/>
      <stop offset="100%" stop-color="#3e2e2e"/>
    </linearGradient>

    <!-- 暗角 -->
    <radialGradient id="vig" cx="50%" cy="45%" r="72%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="55%" stop-color="#000" stop-opacity="0.08"/>
      <stop offset="78%" stop-color="#020403" stop-opacity="0.45"/>
      <stop offset="92%" stop-color="#010201" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.9"/>
    </radialGradient>

    <!-- 颗粒 -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.55
                0 0 0 0 0.62
                0 0 0 0 0.56
                0 0 0 0.35 0" result="tint"/>
      <feComposite in="tint" in2="SourceGraphic" operator="in" result="clip"/>
      <feBlend in="SourceGraphic" in2="clip" mode="overlay"/>
    </filter>
  </defs>

  <!-- ========== 背景 ========== -->
  <rect x="0" y="0" width="512" height="768" fill="url(#bg)"/>
  <!-- 背景混凝土墙面纹理 -->
  <rect x="0" y="0" width="512" height="768" fill="#1a2621" opacity="0.35" filter="url(#grain)"/>
  <g stroke="#0c1310" stroke-width="1" opacity="0.5">
    <line x1="0" y1="140" x2="512" y2="138"/>
    <line x1="0" y1="300" x2="512" y2="302"/>
    <line x1="0" y1="470" x2="512" y2="468"/>
  </g>
  <!-- 墙面水渍 -->
  <path d="M60 138 Q64 200 58 260 Q62 290 56 320" stroke="#0e1512" stroke-width="3" fill="none" opacity="0.45"/>
  <path d="M452 302 Q448 360 455 420" stroke="#0e1512" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- ========== 门框（闸口铁门） ========== -->
  <g>
    <!-- 门洞内部深黑 -->
    <rect x="96" y="60" width="320" height="708" fill="#050807"/>
    <!-- 门框左柱 -->
    <rect x="72" y="40" width="28" height="728" fill="#26322c"/>
    <rect x="72" y="40" width="6" height="728" fill="#3a4a41" opacity="0.8"/>
    <rect x="94" y="40" width="6" height="728" fill="#0b110e"/>
    <!-- 门框右柱 -->
    <rect x="412" y="40" width="28" height="728" fill="#1f2a25"/>
    <rect x="412" y="40" width="6" height="728" fill="#0b110e"/></g>```svg
