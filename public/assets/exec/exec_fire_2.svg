    <g stroke="#ffb040" stroke-width="1.4" stroke-linecap="round" opacity="0.55">
      <line x1="412" y1="560" x2="408" y2="584"/><line x1="468" y1="512" x2="466" y2="530"/>
      <line x1="560" y1="540" x2="563" y2="562"/><line x1="690" y1="600" x2="694" y2="620"/>
    </g>
  </g>

  <!-- 2. 黑烟：多层翻卷 -->
  <g id="smoke" filter="url(#fxSmoke)">
    <path d="M200,700 C150,560 260,470 230,340 C300,400 380,300 420,220 C470,320 560,260 600,160 C660,260 760,300 800,420 C860,520 820,640 760,700 Z" fill="#0a0808" opacity="0.72"/></g>
