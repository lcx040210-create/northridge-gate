<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="1024" height="512">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa89a"/>
      <stop offset="0.5" stop-color="#8e9c8e"/>
      <stop offset="1" stop-color="#7a877b"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b2bfae"/>
      <stop offset="0.35" stop-color="#a3b19f"/>
      <stop offset="0.7" stop-color="#98a694"/>
      <stop offset="1" stop-color="#8a9886"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d8683"/>
      <stop offset="0.25" stop-color="#6a7370"/>
      <stop offset="0.6" stop-color="#5c6461"/>
      <stop offset="1" stop-color="#4e5553"/>
    </linearGradient>
    <linearGradient id="windowLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f8a86"/>
      <stop offset="0.45" stop-color="#58716e"/>
      <stop offset="1" stop-color="#3f5452"/>
    </linearGradient>
    <linearGradient id="grime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4a3a" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#5a4a3a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#4a3a2c" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#1e2420" stop-opacity="0"/>
      <stop offset="1" stop-color="#1e2420" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.35 0" result="mono"/>
      <feComposite in="mono" in2="SourceGraphic" operator="in" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="multiply"/>
    </filter>
  </defs>

  <rect width="1024" height="512" fill="url(#bg)"/>
  <rect width="1024" height="512" fill="url(#wall)" filter="url(#grain)"/>

  <g stroke="#7f8c7c" stroke-width="2" opacity="0.6">
