    <line x1="520" y1="290" x2="507" y2="350" stroke-width="0.7"/>
    <line x1="610" y1="300" x2="597" y2="360" stroke-width="0.6"/>
  </g>
  <!-- 灯光附近被照亮的雨丝 -->
  <g stroke="#ffd98a" stroke-linecap="round" opacity="0.4">
    <line x1="440" y1="320" x2="432" y2="360" stroke-width="0.7"/>
    <line x1="472" y1="330" x2="464" y2="375" stroke-width="0.6"/>
