      <path d="M160,1024 C170,950 210,930 200,860 C240,900 260,840 280,800 C300,880 320,930 310,1024 Z" fill="#ff8a2a" opacity="0.7"/>
      <path d="M760,1024 C750,940 790,900 780,830 C830,880 850,820 880,780 C890,860 910,930 900,1024 Z" fill="#ff7020" opacity="0.65"/>
    </g>
    <!-- 定格火星：静止的圆点与短拖影 -->
    <g fill="#ffcf6a">
      <circle cx="412" cy="560" r="3"/><circle cx="468" cy="512" r="2.2"/>
      <circle cx="560" cy="540" r="2.6"/><circle cx="610" cy="470" r="1.8"/>
      <circle cx="350" cy="620" r="2"/><circle cx="690" cy="600" r="2.4"/>
      <circle cx="520" cy="430" r="1.6"/><circle cx="640" cy="390" r="1.4"/>
