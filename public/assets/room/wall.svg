<!-- ===== 中段：窗框内部 ===== -->
<!-- 引用的已定义渐变/滤镜 id（如与 <defs> 中名称不同请替换）：
     #nightSky #lampGlow #lampCore #glassReflect #fogGrad #frameWood #dropGrad #blurSoft -->

<g id="window-interior">

  <!-- 窗外夜空 -->
  <rect x="160" y="90" width="480" height="420" fill="url(#nightSky)"/>

  <!-- 远处楼影 -->
