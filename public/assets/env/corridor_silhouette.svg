<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 768" width="512" height="768">
  <defs>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d8f5c8" stop-opacity="0.95"/>
      <stop offset="0.15" stop-color="#8fcf9a" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#2f6b4f" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0a1a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040a08"/>
      <stop offset="0.55" stop-color="#0c1f18"/>
      <stop offset="1" stop-color="#050c09"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10261d"/>
      <stop offset="1" stop-color="#020504"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#030605"/>
      <stop offset="0.5" stop-color="#0a1410"/>
      <stop offset="1" stop-color="#030605"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.48" r="0.72">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fd8b5" stop-opacity="0.07"/>
      <stop offset="0.4" stop-color="#9fd8b5" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#9fd8b5" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#9fd8b5" stop-opacity="0"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.75  0 0 0 0 0.6  0 0 0 0.22 0"/>
    </filter>
    <filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="blur1"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="rim"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="fog">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="2" seed="3"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.5  0 0 0 0 0.4  0 0 0 0.35 0"/>
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="win"><rect x="86" y="150" width="340" height="420"/></clipPath>
    <pattern id="rain" width="60" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <line x1="10" y1="0" x2="10" y2="28" stroke="#9fcfb0" stroke-opacity="0.25" stroke-width="1"/>
      <line x1="34" y1="50" x2="34" y2="70" stroke="#9fcfb0" stroke-opacity="0.18" stroke-width="0.8"/>
      <line x1="50" y1="85" x2="50" y2="118" stroke="#9fcfb0" stroke-opacity="0.22" stroke-width="1"/>
      <line x1="22" y1="95" x2="22" y2="108" stroke="#9fcfb0" stroke-opacity="0.15" stroke-width="0.7"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="0 120" dur="0.5s" repeatCount="indefinite" additive="sum"/>
    </pattern>
  </defs>

  <!-- 室内墙 -->
  <rect width="512" height="768" fill="url(#wall)"/>

  <!-- 窗外场景 -->
  <g clip-path="url(#win)">
    <rect x="86" y="150" width="340" height="420" fill="url(#sky)"/>
    <!-- 远处围栏与闸杆 -->
    <g stroke="#06100c" stroke-width="3">
      <line x1="86" y1="420" x2="426" y2="412"/>
      <line x1="100" y1="380" x2="100" y2="440"/>
      <line x1="150" y1="378" x2="150" y2="438"/>
      <line x1="370" y1="374" x2="370" y2="436"/>
      <line x1="415" y1="372" x2="415" y2="436"/>
    </g>
    <!-- 地面 -->
    <path d="M86 430 L426 420 L426 570 L86 570 Z" fill="url(#ground)"/>
    <!-- 远处灯杆 -->
    <line x1="302" y1="232" x2="302" y2="425" stroke="#050b08" stroke-width="4"/>
    <line x1="302" y1="234" x2="286" y2="234" stroke="#050b08" stroke-width="3"/>
    <!-- 闪烁的灯 -->
    <g>
      <circle cx="286" cy="240" r="120" fill="url(#lampGlow)"/>
      <circle cx="286" cy="240" r="5" fill="#eaffe0"/>
      <animate attributeName="opacity" values="1;1;0.15;0.9;0.2;1;1;1;0.05;1" keyTimes="0;0.4;0.42;0.45;0.47;0.5;0.8;0.85;0.87;1" dur="4.5s" repeatCount="indefinite"/>
    </g>
    <!-- 地面反光 -->
    <ellipse cx="275" cy="470" rx="110" ry="14" fill="#6fae88" opacity="0.18" filter="url(#blur4)">
      <animate attributeName="opacity" values="0.18;0.18;0.03;0.15;0.04;0.18;0.18;0.18;0.01;0.18" keyTimes="0;0.4;0.42;0.45;0.47;0.5;0.8;0.85;0.87;1" dur="4.5s" repeatCount="indefinite"/>
    </ellipse>
    <!-- 雾 -->
    <rect x="86" y="300" width="340" height="200" filter="url(#fog)"/>

    <!-- 人形剪影：背光轮廓 -->
    <g>
      <path id="figure" d="M256 262
        c-15 0 -24 12 -24 28 c0 14 6 24 12 29
        c-4 3 -18 6 -28 11 c-10 6 -13 18 -15 34
        l-7 84 c-1 12 1 20 5 22 l4 -2 l6 -80
        l4 0 l-3 70 l-2 90 l14 0 l6 -96 l4 0
        l6 96 l14 0 l-2 -90 l-3 -70 l4 0 l6 80 l4 2
        c4 -2 6 -10 5 -22 l-7 -84 c-2 -16 -5 -28 -15 -34
        c-10 -5 -24 -8 -28 -11 c6 -5 12 -15 12 -29
        c0 -16 -9 -28 -24 -28 Z"
        fill="none" stroke="#b8f0c8" stroke-width="3" opacity="0.55" filter="url(#rim)">
        <animate attributeName="opacity" values="0.55;0.55;0.08;0.5;0.1;0.55;0.55;0.55;0.02;0.55" keyTimes="0;0.4;0.42;0.45;0.47;0.5;0.8;0.85;0.87;1" dur="4.5s" repeatCount="indefinite"/>
      </path>
      <use href="#figure" fill="#000" stroke="none" filter="none" opacity="1"/>
      <path d="M256 262 c-15 0 -24 12 -24 28 c0 14 6 24 12 29 c-4 3 -18 6 -28 11 c-10 6 -13 18 -15 34 l-7 84 c-1 12 1 20 5 22 l4 -2 l6 -80 l4 0 l-3 70 l-2 90 l14 0 l6 -96 l4 0 l6 96 l14 0 l-2 -90 l-3 -70 l4 0 l6 80 l4 2 c4 -2 6 -10 5 -22 l-7 -84 c-2 -16 -5 -28 -15 -34 c-10 -5 -24 -8 -28 -11 c6 -5 12 -15 12 -29 c0 -16 -9 -28 -24 -28 Z" fill="#000"/>
      <!-- 倒影 -->
      <ellipse cx="256" cy="546" rx="40" ry="6" fill="#000" opacity="0.8" filter="url(#blur1)"/>
    </g>

    <!-- 雨 -->
    <rect x="86" y="150" width="340" height="420" fill="url(#rain)"/>
    <!-- 玻璃水痕 -->
    <g stroke="#a8dcbc" stroke-opacity="0.18" fill="none" stroke-width="1.5">
      <path d="M130 150 q3 60 -2 120 q4 40 1 90"/>
      <path d="M190 150 q-2 40 3 80 q-3 30 0 55"/>
      <path d="M345 150 q4 70 -1 140 q3 50 0 110"/>
      <path d="M400 150 q-3 50 2 100"/>
    </g>
    <g fill="#bfe8cc" fill-opacity="0.2">
      <circle cx="128" cy="360" r="2.5"/><circle cx="193" cy="285" r="2"/>
      <circle cx="344" cy="400" r="3"/><circle cx="402" cy="250" r="2"/>
      <circle cx="160" cy="210" r="1.5"/><circle cx="380" cy="500" r="1.8"/>
      <circle cx="230" cy="190" r="1.3"/><circle cx="300" cy="520" r="1.6"/>
    </g>
    <rect x="86" y="150" width="340" height="420" fill="url(#glassSheen)"/>
    <!-- 底部雾气凝结