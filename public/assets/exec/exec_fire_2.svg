<!-- 中段：假定 viewBox="0 0 1600 900"；引用渐变 id：fireCore / fireOuter / bloodGrad / fatGrad / glassGrad / charGrad（如与 defs 不同请替换） -->
<g id="window-scene">
  <!-- 窗外夜色与火光映照 -->
  <rect x="420" y="120" width="760" height="620" fill="#0a0503"/>
  <ellipse cx="800" cy="470" rx="420" ry="360" fill="url(#fireOuter)" opacity="0.35">
    <animate attributeName="opacity" values="0.28;0.42;0.3;0.38;0.28" dur="1.3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- 湿巢伪人：焦黑躯干，站立如火炬 -->
  <g id="pseudo-human">
    <path d="M800 190 C770 190 755 215 758 250 C760 280 772 300 786 312
             C745 330 725 370 722 430 C718 500 735 560 748 620
             L742 740 L778 740 L790 640 L810 640 L822 740 L858 740
             L852 620 C865 560 882 500 878 430 C875 370 855 330 814 312
             C828 300 840 280 842 250 C845 215 830 190 800 190 Z"
          fill="url(#charGrad)" stroke="#1a0c06" stroke-width="3"/>
    <!-- 过长的手臂，垂至膝下 -->
    <path d="M728 350 C690 420 680 520 688 640 C690 660 700 668 706 650 C708 560 718 470 748 400 Z" fill="url(#charGrad)"/>
    <path d="M872 350 C910 420 920 520 912 640 C910 660 900 668 894 650 C892 560 882 470 852 400 Z" fill="url(#charGrad)"/>
    <!-- 湿巢孔洞：胸腹部蜂巢状溃孔，内透火光 -->
    <g fill="url(#fireCore)" opacity="0.9">
      <ellipse cx="785" cy="400" rx="9" ry="12"/>
      <ellipse cx="812" cy="388" rx="7" ry="10"/>
      <ellipse cx="800" cy="425" rx="10" ry="8"/>
      <ellipse cx="775" cy="450" rx="6" ry="9"/>
      <ellipse cx="822" cy="445" rx="8" ry="11"/>
      <ellipse cx="798" cy="475" rx="7" ry="7"/>
      <ellipse cx="780" cy="500" rx="9" ry="6"/>
      <ellipse cx="818" cy="505" rx="6" ry="8"/>
      <animate attributeName="opacity" values="0.7;1;0.8;1;0.7" dur="0.9s" repeatCount="indefinite"/>
    </g>
    <!-- 空洞的眼与张开的嘴 -->
    <ellipse cx="786" cy="245" rx="7" ry="10" fill="url(#fireCore)"/>
    <ellipse cx="814" cy="245" rx="7" ry="10" fill="url(#fireCore)"/>
    <path d="M788 275 Q800 300 812 275 Q800 285 788 275 Z" fill="#ffdd88"/>
  </g>

  <!-- 包裹全身的火焰 -->
  <g id="flames">
    <path d="M700 740 C690 640 720 600 710 520 C700 450 740 420 730 340 C725 290 760 260 750 190
             C780 230 770 150 800 90 C830 150 820 230 850 190 C840 260 875 290 870 340
             C860 420 900 450 890 520 C880 600 910 640 900 740 Z"
          fill="url(#fireOuter)" opacity="0.75">
      <animate attributeName="d" dur="1.1s" repeatCount="indefinite"
        values="M700 740 C690 640 720 600 710 520 C700 450 740 420 730 340 C725 290 760 260 750 190 C780 230 770 150 800 90 C830 150 820 230 850 190 C840 260 875 290 870 340 C860 420 900 450 890 520 C880 600 910 640 900 740 Z;
                M705 740 C680 650 725 590 705 515 C695 440 745 425 725 335 C730 280 755 250 760 175 C785 215 780 140 805 70 C825 140 815 220 845 180 C845 255 870 295 875 335 C865 425 905 445 895 515 C885 600 915 645 895 740 Z;
                M700 740 C690 640 720 600 710 520 C700 450 740 420 730 340 C725 290 760 260 750 190 C780 230 770 150 800 90 C830 150 820 230 850 190 C840 260 875 290 870 340 C860 420 900 450 890 520 C880 600 910 640 900 740 Z"/>
    </path>
    <path d="M740 740 C735 650 760 600 752 520 C748 450 770 400 765 320 C770 270 785 240 800 170
             C815 240 830 270 835 320 C830 400 852 450 848 520 C840 600 865 650 860 740 Z"
          fill="url(#fireCore)" opacity="0.85">
      <animate attributeName="opacity" values="0.7;0.95;0.8;0.9;0.7" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- 手臂上的火舌 -->
    <path d="M690 650 C670 580 700 540 685 470 C700 500 715 460 710 420 C730 480 720 560 715 650 Z" fill="url(#fireOuter)" opacity="0.8"/>
    <path d="M910 650 C930 580 900 540 915 470 C900 500 885 460 890 420 C870 480 880 560 885 650 Z" fill="url(#fireOuter)" opacity="0.8"/>
    <!-- 火星 -->
    <g fill="#ffcc55">
      <circle cx="770" cy="150" r="3"><animate attributeName="cy" values="150;60" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="835" cy="170" r="2"><animate attributeName="cy" values="170;80" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="805" cy="120" r="2.5"><animate attributeName="cy" values="120;30" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2.4s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- 脂肪状组织滴落 -->
  <g id="fat-drips" fill="url(#fatGrad)">
