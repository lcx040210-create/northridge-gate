           L360 410 L360 372 L395 372 L395 340 L430 340 L430 400 L500 400 L500 360 L545 360 L545 390
           L600 390 L600 355 L640 355 L640 405 L680 405 L680 510 L120 510 Z"
        fill="#05070d" opacity="0.92"/>

  <!-- 远处昏黄灯光 -->
  <circle cx="455" cy="355" r="70" fill="url(#lampGlow)" opacity="0.55"/>
  <circle cx="455" cy="355" r="22" fill="url(#lampGlow)" opacity="0.9"/>
  <circle cx="455" cy="355" r="4" fill="#ffd98a"/>
  <line x1="455" y1="359" x2="455" y2="410" stroke="#0a0c12" stroke-width="2"/>
  <!-- 零星窗灯 -->
  <rect x="178" y="362" width="5" height="7" fill="#c9a24a" opacity="0.5"/>
  <rect x="272" y="378" width="4" height="6" fill="#c9a24a" opacity="0.35"/>
  <rect x="560" y="372" width="5" height="6" fill="#c9a24a" opacity="0.4"/>
  <!-- 地面灯光倒影 -->
  <ellipse cx="455" cy="470" rx="45" ry="6" fill="#ffcf70" opacity="0.12"/>
  <path d="M452 420 L458 420 L462 505 L448 505 Z" fill="#ffcf70" opacity="0.08"/>

  <!-- 雨丝（斜向） -->
  <g stroke="#9fb4d0" stroke-linecap="round" opacity="0.35">
    <line x1="140" y1="100" x2="128" y2="150" stroke-width="0.8"/>
    <line x1="185" y1="130" x2="172" y2="190" stroke-width="0.6"/>
    <line x1="230" y1="95"  x2="218" y2="150" stroke-width="0.9"/>
