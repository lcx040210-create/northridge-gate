      <path d="M548 188 L572 186 L578 206 L566 216 L546 212 Z"/>
      <path d="M535 175 L585 172 L596 214 L572 232 L530 222 Z" opacity="0.6"/>
    </g>
    <!-- 裂纹暗边，增加厚度感 -->
    <g stroke="#0a0f18" stroke-width="0.6" opacity="0.5" transform="translate(0.8,0.8)">
      <path d="M560 200 L592 168 L610 140 L640 118"/>
      <path d="M560 200 L574 250 L566 300 L585 345"/>
      <path d="M560 200 L518 228 L480 236 L455 262"/>
