    <line x1="200" y1="300" x2="192" y2="340"/>
    <line x1="600" y1="330" x2="592" y2="370"/>
  </g>
  <!-- 灯光附近被照亮的雨丝 -->
  <g stroke="#f4d08a" stroke-width="1.2" stroke-linecap="round" opacity="0.6">
    <line x1="385" y1="240" x2="378" y2="275"/>
    <line x1="428" y1="255" x2="421" y2="290"/>
    <line x1="398" y1="320" x2="391" y2="355"/>
    <line x1="445" y1="310" x2="438" y2="345"/>
    <line x1="370" y1="330" x2="363" y2="365"/>
