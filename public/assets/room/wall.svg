    <path d="M120 440 L170 425 L205 432 L250 410 L262 418" stroke="#e8eef5" stroke-width="0.8" opacity="0.5"/>
    <path d="M205 432 L215 455" stroke="#e8eef5" stroke-width="0.5" opacity="0.4"/>
  </g>
  <circle cx="560" cy="200" r="3" fill="#ffffff" opacity="0.5"/>

</g>```svg
