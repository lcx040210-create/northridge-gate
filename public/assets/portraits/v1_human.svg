<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 768" width="512" height="768">
```svg

  <defs>
    <!-- 背景：冷绿暗调，底部渗一点暗红 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1613"/>
      <stop offset="30%" stop-color="#12211c"/>
      <stop offset="60%" stop-color="#0e1a16"/>
      <stop offset="85%" stop-color="#140f0e"/>
      <stop offset="100%" stop-color="#1e0c0c"/>
    </linearGradient>

    <!-- 顶光：头顶冷绿荧光灯锥 -->
    <radialGradient id="topLight" cx="0.5" cy="0" r="0.75" fx="0.5" fy="0">
      <stop offset="0%" stop-color="#cfe8d8" stop-opacity="0.55"/>
      <stop offset="25%" stop-color="#8fb9a2" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#4c7563" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0c1613" stop-opacity="0"/>
    </radialGradient>

    <!-- 脸：苍白、偏冷，右下侧转入阴影 -->
    <radialGradient id="face" cx="0.45" cy="0.38" r="0.68" fx="0.42" fy="0.3">
      <stop offset="0%" stop-color="#d9d6cc"/>
      <stop offset="30%" stop-color="#c3c2b6"/>
      <stop offset="55%" stop-color="#a5a89c"/>
      <stop offset="78%" stop-color="#7d8479"/>
      <stop offset="92%" stop-color="#555d55"/>
      <stop offset="100%" stop-color="#3a423d"/>
    </radialGradient>

    <!-- 额头：顶光高光，湿润反光 -->
    <radialGradient id="forehead" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#eef0e6" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#cfd3c7" stop-opacity="0.28"/>
      <stop offset="75%" stop-color="#a9ae9f" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#a9ae9f" stop-opacity="0"/>
    </radialGradient>

    <!-- 眼窝：疲惫的青灰黑眼圈 -->
    <radialGradient id="socket" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0%" stop-color="#3e4640" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#565f58" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#6f766c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7d8479" stop-opacity="0"/>
    </radialGradient>

    <!-- 脸颊：极淡的冷红血色 -->
    <radialGradient id="cheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a8837a" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#9a8078" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#9a8078" stop-opacity="0"/>
    </radialGradient>

    <!-- 通用阴影：下颌、帽檐投影 -->
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a110e" stop-opacity="0"/>
      <stop offset="40%" stop-color="#0a110e" stop-opacity="0.25"/>
      <stop offset="75%" stop-color="#0a110e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#050908" stop-opacity="0.8"/>
    </linearGradient>

    <!-- 眼白：略带血丝的灰白 -->
    <radialGradient id="eyeW" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0%" stop-color="#e4e3da"/>
      <stop offset="55%" stop-color="#c9c7bc"/>
      <stop offset="82%" stop-color="#a99f96"/>
      <stop offset="100%" stop-color="#7a6b66"/>
    </radialGradient>

    <!-- 虹膜：正常的灰褐色 -->
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#1a1714"/>
      <stop offset="28%" stop-color="#2b261f"/>
      <stop offset="45%" stop-color="#5d5444"/>
      <stop offset="70%" stop-color="#6f6752"/>
      <stop offset="90%" stop-color="#433e32"/>
      <stop offset="100%" stop-color="#211e19"/>
    </radialGradient>

    <!-- 脖子：上部被下颌遮挡变暗 -->
    <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d4540"/>
      <stop offset="30%" stop-color="#6c736a"/>
      <stop offset="65%" stop-color="#8d9387"/>
      <stop offset="100%" stop-color="#5d655d"/>
    </linearGradient>

    <!-- 制服：深灰，雨水浸湿后带冷绿反光 -->
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a423f"/>
      <stop offset="25%" stop-color="#2c3331"/>
      <stop offset="50%" stop-color="#232927"/>
      <stop offset="75%" stop-color="#1a1f1e"/>
      <stop offset="100%" stop-color="#101413"/>
    </linearGradient>

    <!-- 软帽：深灰呢料，顶部受光 -->
    <linearGradient id="helmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a625e"/>
      <stop offset="30%" stop-color="#3f4744"/>
      <stop offset="65%" stop-color="#2a302e"/>
      <stop offset="100%" stop-color="#151a19"/>
    </linearGradient>

    <!-- 嘴唇：失血的暗红灰 -->
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a5a57"/>
      <stop offset="45%" stop-color="#8e6b66"/>
      <stop offset="70%" stop-color="#6e4e4b"/>
      <stop offset="100%" stop-color="#4a3432"/>
    </linearGradient>

    <!-- 暗角 -->
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="55%" stop-color="#000" stop-opacity="0.15"/>
      <stop offset="80%" stop-color="#050807" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#020303" stop-opacity="0.9"/>
    </radialGradient>

    <!-- 胶片颗粒 -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.45
                0 0 0 0 0.52
                0 0 0 0 0.48
                0 0 0 0.35 0" result="tint"/>
      <feComposite in="tint" in2="SourceGraphic" operator="in" result="clip"/>
      <feBlend in="SourceGraphic" in2="clip" mode="overlay"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="512" height="768" fill="url(#bg)"/>
  <!-- 墙面水渍竖纹 -->
  <g opacity="0.18" stroke="#1f2e28" stroke-width="3">
    <line x1="40" y1="0" x2="44" y2="768"/>
    <line x1="92" y1="0" x2="90" y2="768"/>
    <line x1="430" y1="0" x2="433" y2="768"/>
    <line x1="478" y1="0" x2="475" y2="768"/>
  </g>

  <!-- 门框：闸口值班室铁门 -->
  <g>
    <rect x="96" y="40" width="320" height="728" fill="#0a120f"/>
    <rect x="96" y="40" width="320" height="728" fill="none" stroke="#26342e" stroke-width="14"/>
    <rect x="110" y="54" width="292" height="714" fill="none" stroke="#111a16" stroke-width="4"/>
    <!-- 门框锈迹暗红 -->
    <path d="M96 520 Q100 560 96 610 L103 610 Q106 560 103 520 Z" fill="#3a1614" opacity="0.6"/>
    <path d="M409 180 Q413 220 409 260 L416 260 Q418 220 416 180 Z" fill="#3a1614" opacity="0.45"/>
    <!-- 铆钉 -->
    <g fill="#34443c">
      <circle cx="103" cy="80" r="3"/>
      <circle cx="103" cy="300" r="3"/>
      <circle cx="409" cy="80" r="3"/>
      <circle cx="409" cy="300" r="3"/>
    </g>
  </g>

  <!-- 顶光 -->
  <rect x="0" y="0" width="512" height="768" fill="url(#topLight)"/>
  <ellipse cx="256" cy="18" rx="70" ry="8" fill="#dff2e6" opacity="0.35"/>

  <!-- 躯干：深灰制服 -->
  <g filter="url(#grain)">
    <path d="M60 768 L70 590 Q82 505 168 478 L226 458 L286 458 L344 478 Q430 505 442 590 L452 768 Z"
          fill="url(#suit)"/>
    <!-- 肩部受光与湿痕 --></g>```svg
