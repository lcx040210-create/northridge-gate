<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
<filter id="grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" stitchTiles="stitch" result="n"/>
<feColorMatrix type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.16  0 0 0 0 0.13  0 0 0 0.55 0"/>
</filter>
<filter id="mottle" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="3" stitchTiles="stitch"/>
<feColorMatrix type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.08  0 0 0 0 0.06  0 0 0 -1.6 1.05"/>
</filter>
<filter id="mold" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="5" seed="11" stitchTiles="stitch"/>
<feColorMatrix type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.16  0 0 0 0 0.07  0 0 0 -3.2 1.25"/>
</filter>
<filter id="rust" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="4" seed="29" stitchTiles="stitch"/>
<feColorMatrix type="matrix" values="0 0 0 0 0.28  0 0 0 0 0.06  0 0 0 0 0.05  0 0 0 -4.5 1.55"/>
</filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="9"/>
</filter>
<filter id="softS" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="3"/>
</filter>
<filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
<feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="5" result="t"/>
<feDisplacementMap in="SourceGraphic" in2="t" scale="18" xChannelSelector="R" yChannelSelector="G" result="d"/>
<feGaussianBlur in="d" stdDeviation="1.2"/>
</filter>
<radialGradient id="puddle" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#0a1411" stop-opacity="0.85"/>
<stop offset="0.7" stop-color="#0d1a16" stop-opacity="0.6"/>
<stop offset="1" stop-color="#0d1a16" stop-opacity="0"/>
</radialGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#9fc4b2" stop-opacity="0"/>
<stop offset="0.45" stop-color="#9fc4b2" stop-opacity="0.22"/>
<stop offset="0.55" stop-color="#cfe6da" stop-opacity="0.12"/>
<stop offset="1" stop-color="#9fc4b2" stop-opacity="0"/>
</linearGradient>
<radialGradient id="oil" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#050807" stop-opacity="0.9"/>
<stop offset="0.6" stop-color="#0b0f0d" stop-opacity="0.55"/>
<stop offset="1" stop-color="#0b0f0d" stop-opacity="0"/>
</radialGradient>
<radialGradient id="blood" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#2a0a0a" stop-opacity="0.8"/>
<stop offset="0.6" stop-color="#3a0e0c" stop-opacity="0.45"/>
<stop offset="1" stop-color="#3a0e0c" stop-opacity="0"/>
</radialGradient>
<radialGradient id="stain" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#101613" stop-opacity="0.7"/>
<stop offset="1" stop-color="#101613" stop-opacity="0"/>
</radialGradient>
<pattern id="tile" width="512" height="512" patternUnits="userSpaceOnUse">
<rect width="512" height="512" fill="#2b3531"/>
<rect width="512" height="512" filter="url(#mottle)"/>
<rect width="512" height="512" filter="url(#mold)" opacity="0.75"/>
<rect width="512" height="512" filter="url(#rust)" opacity="0.5"/>
</pattern>
<g id="stains">
<ellipse cx="130" cy="150" rx="70" ry="45" fill="url(#oil)" filter="url(#rough)"/>
<ellipse cx="160" cy="175" rx="30" ry="18" fill="url(#oil)" filter="url(#rough)"/>
<ellipse cx="390" cy="360" rx="95" ry="60" fill="url(#puddle)" filter="url(#rough)"/>
<ellipse cx="380" cy="350" rx="70" ry="30" fill="url(#sheen)" filter="url(#softS)" transform="rotate(-18 380 350)"/>
<ellipse cx="410" cy="372" rx="30" ry="6" fill="#bcd8ca" opacity="0.08" filter="url(#softS)" transform="rotate(-18 410 372)"/>
<ellipse cx="300" cy="120" rx="36" ry="24" fill="url(#blood)" filter="url(#rough)"/>
<ellipse cx="325" cy="140" rx="12" ry="7" fill="url(#blood)" filter="url(#rough)"/>
<circle cx="345" cy="152" r="3" fill="#2e0b0a" opacity="0.6"/>
<circle cx="352" cy="162" r="2" fill="#2e0b0a" opacity="0.5"/>
<ellipse cx="90" cy="410" rx="60" ry="40" fill="url(#stain)" filter="url(#soft)"/>
<ellipse cx="250" cy="300" rx="45" ry="35" fill="url(#stain)" filter="url(#soft)"/>
<ellipse cx="470" cy="60" rx="50" ry="35" fill="url(#stain)" filter="url(#soft)"/>
<ellipse cx="200" cy="460" rx="40" ry="22" fill="url(#oil)" filter="url(#rough)" opacity="0.7"/>
</g>
<g id="cracks" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M0 238 L38 232 L71 246 L108 240 L132 262 L170 258 L205 281 L238 276 L262 300" stroke="#0b100e" stroke-width="2.2" opacity="0.85"/>
<path d="M262 300 L290 322 L318 318 L350 340 L372 336" stroke="#0b100e" stroke-width="1.6" opacity="0.8"/>
<path d="M132 262 L128 290 L140 318 L134 345" stroke="#0b100e" stroke-width="1.1" opacity="0.7"/>
<path d="M205 281 L214 250 L232 232 L236 205" stroke="#0b100e" stroke-width="0.9" opacity="0.6"/>
<path d="M440 0 L436 30 L452 62 L446 96 L462 128 L458 160" stroke="#0b100e" stroke-width="1.5" opacity="0.75"/>
<path d="M440 512 L436 488 L448 470" stroke="#0b100e" stroke-width="1.5" opacity="0.75"/>
<path d="M452 62 L480 74 L512 70" stroke="#0b100e" stroke-width="1" opacity="0.6"/>
<path d="M0 70 L22 78 L40 72" stroke="#0b100e" stroke-width="1" opacity="0.6"/>
<path d="M60 0 L66 22 L58 48 L72 70" stroke="#0b100e" stroke-width="0.9" opacity="0.55"/>
<path d="M60 512 L57 492" stroke="#0b100e" stroke-width="0.9" opacity="0.55"/>
<path d="M300 420 L322 436 L318 460 L340 480" stroke="#0b100e" stroke-width="1" opacity="0.6"/>
<path d="M0 238 L38 232 L71 246 L108 240 L132 262 L170 258 L205 281 L238 276 L262 300" stroke="#55665d" stroke-width="0.7" opacity="0.35" transform="translate(1 1)"/>
<path d="M512 238 L490 236" stroke="#0b100e" stroke-width="2.2" opacity="0.85"/>
</g>
</defs>
<rect width="512" height="512" fill="url(#tile)"/>
<g>
<use href="#stains"/>
<use href="#stains" x="-512"/>
<use href="#stains" x="512"/>
<use href="#stains" y="-512"/>
<use href="#stains" y="512"/>
</g>
<use href="#cracks"/>
<rect width="512" height="512" filter="url(#grain)"/>
<rect width="512" height="512" fill="#0f2a22" opacity="0.18"/>
</svg>