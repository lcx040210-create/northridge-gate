<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="1024" height="512">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1512"/>
      <stop offset="0.5" stop-color="#121d18"/>
      <stop offset="1" stop-color="#080d0b"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3a31"/>
      <stop offset="0.35" stop-color="#34483c"/>
      <stop offset="0.7" stop-color="#26352d"/>
      <stop offset="1" stop-color="#1a2520"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a564f"/>
      <stop offset="0.15" stop-color="#6b7a70"/>
      <stop offset="0.5" stop-color="#3a453f"/>
      <stop offset="0.85" stop-color="#2b332e"/>
      <stop offset="1" stop-color="#1c221f"/>
    </linearGradient>
    <radialGradient id="windowLight" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#6f9a82" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#3d5e4c" stop-opacity="0.45"/>
      <stop offset="0.8" stop-color="#15241c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#070c09" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="grime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f0c" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#1a1f14" stop-opacity="0.25"/>
      <stop offset="0.85" stop-color="#2a1c12" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#140a07" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.12  0 0 0 0 0.09  0 0 0 0.55 0" result="tint"/>
      <feComposite in="tint" in2="SourceGraphic" operator="in" result="grainMask"/>
      <feBlend in="SourceGraphic" in2="grainMask" mode="multiply"/>
    </filter>
  </defs>

  <!-- 底色 -->
  <rect x="0" y="0" width="1024" height="512" fill="url(#bg)"/>

  <!-- 混凝土墙体 -->
  <g filter="url(#grain)">
    <rect x="0" y="0" width="1024" height="512" fill="url(#wall)"/>
    <!-- 墙面分缝 -->
    <g stroke="#141c18" stroke-width="2" opacity="0.7">
      <line x1="0" y1="128" x2="1024" y2="128"/>
      <line x1="0" y1="384" x2="1024" y2="384"/>
      <line x1="256" y1="0" x2="256" y2="128"/>
      <line x1="768" y1="0" x2="768" y2="128"/>
      <line x1="128" y1="128" x2="128" y2="384"/>
      <line x1="896" y1="128" x2="896" y2="384"/>
      <line x1="256" y1="384" x2="256" y2="512"/>
      <line x1="768" y1="384" x2="768" y2="512"/>
    </g>
    <!-- 下半墙墙裙旧漆（深绿） -->
    <rect x="0" y="330" width="1024" height="182" fill="#1e2d24" opacity="0.75"/>
    <rect x="0" y="326" width="1024" height="6" fill="#0f1612" opacity="0.8"/>
    <!-- 剥落的油漆块 -->
    <g fill="#4b5d50" opacity="0.55">
      <path d="M40 60 q18 -10 34 2 q10 14 -4 24 q-20 8 -32 -4 z"/>
      <path d="M190 210 q25 -8 40 6 q6 18 -14 22 q-22 4 -28 -10 z"/>
      <path d="M860 70 q30 -6 42 10 q-4 20 -26 18 q-20 -4 -16 -28 z"/>
      <path d="M930 250 q14 -12 30 0 q8 16 -8 24 q-18 2 -22 -24 z"/>
      <path d="M90 400 q28 -10 46 4 q2 22 -22 24 q-26 -2 -24 -28 z"/>
      <path d="M820 430 q20 -8 34 6 q-2 18 -20 16 q-16 -4 -14 -22 z"/>
    </g>
    <!-- 剥落处露出的底层混凝土 -->
    <g fill="#57574d" opacity="0.4">
      <path d="M48 66 q10 -4 18 4 q2 8 -8 10 q-10 0 -10 -14 z"/>
      <path d="M200 216 q12 -2 20 6 q-2 8 -12 8 q-10 -2 -8 -14 z"/>
      <path d="M100 406 q14 -4 22 6 q-4 10 -14 8 q-10 -4 -8 -14 z"/>
      <path d="M870 76 q14 -2 20 8 q-6 8 -14 6 q-8 -4 -6 -14 z"/>
    </g>
    <!-- 水渍流痕 -->
    <g stroke="#0e1511" stroke-linecap="round" opacity="0.45" fill="none">
      <path d="M300 0 q2 60 -3 120 q-2 50 4 90" stroke-width="5"/>
      <path d="M318 0 q-2 40 2 80" stroke-width="3"/>
      <path d="M700 0 q4 70 -2 150 q-3 40 3 70" stroke-width="6"/>
      <path d="M735 0 q0 50 -3 100" stroke-width="2.5"/>
      <path d="M160 128 q3 60 -2 130" stroke-width="3"/>
      <path d="M880 128 q-2 80 3 160" stroke-width="4"/>
    </g>
    <!-- 暗红锈迹/污渍 -->
    <g fill="#4a1a14" opacity="0.4">
      <ellipse cx="342" cy="365" rx="22" ry="8"/>
      <ellipse cx="690" cy="372" rx="30" ry="9"/>
      <path d="M338 360 q3 40 -2 90" stroke="#3d130e" stroke-width="3" fill="none"/>
      <path d="M684 368 q4 30 0 70" stroke="#3d130e" stroke-width="2.5" fill="none"/>
    </g>
    <!-- 霉斑 -->
    <g fill="#0a110d" opacity="0.5">
      <circle cx="60" cy="480" r="30"/>
      <circle cx="100" cy="495" r="22"/>
      <circle cx="980" cy="470" r="34"/>
      <circle cx="940" cy="500" r="20"/>
      <circle cx="20" cy="20" r="26"/>
      <circle cx="1000" cy="18" r="30"/>
    </g>
    <!-- 细裂纹 -->
    <g stroke="#0b100d" stroke-width="1.2" fill="none" opacity="0.7">
      <path d="M210 40 l12 18 l-6 14 l14 22 l-4 16"/>
      <path d="M820 300 l-10 14 l8 12 l-12 20"/>
      <path d="M60 250 l18 6 l10 -8 l16 10"/>
    </g>
    <!-- 底部污垢 -->
    <rect x="0" y="0" width="1024" height="512" fill="url(#grime)"/>
  </g>

  <!-- 中央加固观察窗 -->
  <g id="observationWindow">
    <!-- 窗洞投影 -->
    <rect x="318" y="88" width="396" height="248" rx="4" fill="#050806" opacity="0.6"/>
    <!-- 外框 -->
    <rect x="312" y="80" width="400" height="250" rx="4" fill="url(#frame)" stroke="#0e1310" stroke-width="3"/>
    <!-- 内框凹槽 -->
    <rect x="336" y="102" width="352" height="206" fill="#101713" stroke="#2c3630" stroke-width="2"/>
    <!-- 玻璃区域 -->
    <rect x="344" y="110" width="336" height="190" fill="url(#windowLight)"/>
    <!-- 加固竖梃与横档 -->
    <rect x="507" y="110" width="10" height="190" fill="url(#frame)" stroke="#0e1310" stroke-width="1.5"/>
    <rect x="344" y="200" width="336" height="8" fill="url(#frame)" stroke="#0e1310" stroke-width="1.5"/>
    <!-- 框体锈边 -->
    <path d="M312 318 h400 v12 h-400 z" fill="#3a1812" opacity="0.45"/>
    <path d="M330 330 q2 14 -1 26 M560 330 q3 10 0 22 M690 330 q-2 12 1 20" stroke="#4a1a14" stroke-width="2.5" fill="none" opacity="0.6"/>
    <!-- 铆钉 -->
    <g fill="#7d8a80" stroke="#141a16" stroke-width="1">
      <circle cx="324" cy="92" r="4"/><circle cx="700" cy="92" r="4"/>
      <circle cx="324" cy="318" r="4"/><circle cx="700" cy="318" r="4"/>
      <circle cx="374" cy="91" r="3.5"/><circle cx="424" cy="91" r="3.5"/><circle cx="474" cy="91" r="3.5"/>
      <circle cx="550" cy="91" r="3.5"/><circle cx="600" cy="91" r="3.5"/><circle cx="650" cy="91" r="3.5"/>
      <circle cx="374" cy="319" r="3.5"/><circle cx="424" cy="319" r="3.5"/><circle cx="474" cy="319" r="3.5"/>
      <circle cx="550" cy="319" r="3.5"/><circle cx="600" cy="319" r="3.5"/></g></g>```svg
<!-- ===== 中段：窗框内部 =====
     假定已定义渐变 id：nightSky（夜空）、lampGlow（灯光径向）、glassSheen（玻璃反光）、fogGrad（凝雾）
     窗内区域假定：x=120 y=90 w=560 h=420，如有不同请整体调整 transform -->
<g id="window-interior">

  <!-- 窗外深夜 -->
  <rect x="120" y="90" width="560" height="420" fill="url(#nightSky)"/>

  <!-- 远处建筑剪影 -->
