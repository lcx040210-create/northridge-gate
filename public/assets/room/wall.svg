  <path d="M600 300 L630 280 L630 330 L605 350 Z" fill="url(#glassReflect)" opacity="0.15"/>

  <!-- 水渍流痕 -->
  <g fill="none" stroke="#c8d6ea" stroke-linecap="round" opacity="0.45">
