    <line x1="500" y1="100" x2="486" y2="165" stroke-width="0.8"/>
    <line x1="545" y1="180" x2="532" y2="245" stroke-width="0.7"/>
    <line x1="590" y1="115" x2="576" y2="180" stroke-width="0.9"/>
    <line x1="635" y1="210" x2="622" y2="270" stroke-width="0.6"/>
    <line x1="665" y1="130" x2="652" y2="190" stroke-width="0.7"/>
    <line x1="160" y1="260" x2="148" y2="320" stroke-width="0.6"/>
    <line x1="250" y1="290" x2="237" y2="350" stroke-width="0.8"/>
