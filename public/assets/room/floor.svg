<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
<filter id="grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" stitchTiles="stitch" result="n"/>
<feColorMatrix in="n" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.46  0 0 0 0 0.42  0 0 0 0.55 0" result="g"/>
<feComposite in="g" in2="SourceGraphic" operator="in"/>
</filter>
<filter id="mottle" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="3" stitchTiles="stitch" result="m"/>
<feColorMatrix in="m" type="matrix" values="0 0 0 0 0.50  0 0 0 0 0.55  0 0 0 0 0.49  0 0 0 0.9 -0.3"/>
</filter>
<filter id="mold" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" seed="11" stitchTiles="stitch" result="t"/>
<feColorMatrix in="t" type="matrix" values="0 0 0 0 0.26  0 0 0 0 0.34  0 0 0 0 0.22  0 0 0 3 -1.55"/>
</filter>
<filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="blur1"><feGaussianBlur stdDeviation="0.6"/></filter>
<radialGradient id="oil" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#2f3530" stop-opacity="0.55"/>
<stop offset="0.6" stop-color="#3c443d" stop-opacity="0.35"/>
<stop offset="1" stop-color="#4a524a" stop-opacity="0"/>
</radialGradient>
<radialGradient id="sheen" cx="45%" cy="45%" r="55%">
<stop offset="0" stop-color="#6a5f7a" stop-opacity="0.18"/>
<stop offset="0.5" stop-color="#5d7a74" stop-opacity="0.12"/>
<stop offset="1" stop-color="#7a7a55" stop-opacity="0"/>
</radialGradient>
<linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#b9c6c0" stop-opacity="0.55"/>
<stop offset="0.45" stop-color="#7d8c86" stop-opacity="0.35"/>
<stop offset="1" stop-color="#a8b6b0" stop-opacity="0.5"/>
</linearGradient>
<radialGradient id="stain" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#5a5a44" stop-opacity="0.45"/>
<stop offset="1" stop-color="#5a5a44" stop-opacity="0"/>
</radialGradient>
<radialGradient id="rust" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#6e5a3e" stop-opacity="0.4"/>
<stop offset="1" stop-color="#6e5a3e" stop-opacity="0"/>
</radialGradient>
</defs>

<rect width="512" height="512" fill="#8e9a90"/>
<rect width="512" height="512" filter="url(#mottle)" opacity="0.7"/>
<rect width="512" height="512" fill="#fff" filter="url(#grain)" opacity="0.6"/>
<rect width="512" height="512" filter="url(#mold)" opacity="0.55"/>

<g filter="url(#blur8)">
<ellipse cx="0" cy="0" rx="60" ry="45" fill="url(#stain)"/>
<ellipse cx="512" cy="0" rx="60" ry="45" fill="url(#stain)"/>
<ellipse cx="0" cy="512" rx="60" ry="45" fill="url(#stain)"/>
<ellipse cx="512" cy="512" rx="60" ry="45" fill="url(#stain)"/>
<ellipse cx="380" cy="120" rx="50" ry="30" fill="url(#rust)"/>
