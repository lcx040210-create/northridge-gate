  <rect x="163" y="93" width="474" height="414" fill="none" stroke="#f0c070" stroke-opacity="0.12" stroke-width="1"/>

  <!-- 窗台积水反光 -->
  <rect x="160" y="500" width="480" height="10" fill="#e8b860" opacity="0.12"/>
</g>```svg
  <!-- ===== 末段：污渍 / 水痕 / 霉斑 / 暗红残痕 / 罩色 / 颗粒 / 暗角 ===== -->

  <!-- 本段所需滤镜与渐变（直接放置，不包 defs） -->
  <filter id="stainBlur" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="28" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation="6"/>
  </filter>
  <filter id="dripRough" x="-10%" y="-5%" width="120%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.08 0.012" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="10"/>
    <feGaussianBlur stdDeviation="1.4"/>
  </filter>
  <filter id="moldSpeck" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="t"/>
    <feColorMatrix in="t" type="matrix"
      values="0 0 0 0 0.16
              0 0 0 0 0.20
              0 0 0 0 0.12
              0 0 0 9 -5.2"/>
    <feComposite in2="SourceGraphic" operator="in"/>
  </filter>
  <filter id="bloodEdge" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="21" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="14"/>
    <feGaussianBlur stdDeviation="0.8"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="5" stitchTiles="stitch" result="g"/>
    <feColorMatrix in="g" type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.55"/>
    </feComponentTransfer>
  </filter>
  <radialGradient id="stainGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#3a3222" stop-opacity="0.45"/>
    <stop offset="0.6" stop-color="#4a3f2a" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#4a3f2a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="ringGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0.72" stop-color="#5a4a30" stop-opacity="0"/>
    <stop offset="0.88" stop-color="#5a4a30" stop-opacity="0.28"/>
    <stop offset="1" stop-color="#5a4a30" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="dripGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2e2a1e" stop-opacity="0.5"/>
    <stop offset="0.7" stop-color="#3b3526" stop-opacity="0.2"/>
    <stop offset="1" stop-color="#3b3526" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="vignette" cx="50%" cy="48%" r="75%">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="0.85" stop-color="#050805" stop-opacity="0.28"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
  </radialGradient>

  <!-- 大块陈旧污渍 -->
  <g filter="url(#stainBlur)" style="mix-blend-mode:multiply">
    <ellipse cx="310" cy="220" rx="190" ry="130" fill="url(#stainGrad)"/>
    <ellipse cx="1560" cy="340" rx="240" ry="160" fill="url(#stainGrad)"/>
    <ellipse cx="980" cy="120" rx="160" ry="80" fill="url(#stainGrad)" opacity="0.8"/>
    <ellipse cx="1700" cy="820" rx="200" ry="150" fill="url(#stainGrad)" opacity="0.7"/>
    <ellipse cx="180" cy="760" rx="150" ry="210" fill="url(#stainGrad)" opacity="0.75"/>
  </g>

  <!-- 水渍干涸环 -->
  <g filter="url(#stainBlur)" style="mix-blend-mode:multiply">
    <ellipse cx="1240" cy="260" rx="150" ry="105" fill="url(#ringGrad)"/>
    <ellipse cx="1270" cy="290" rx="95" ry="70" fill="url(#ringGrad)" opacity="0.8"/>
    <ellipse cx="520" cy="480" rx="120" ry="90" fill="url(#ringGrad)" opacity="0.7"/>
  </g>

  <!-- 顺墙下淌的水痕 -->
  <g filter="url(#dripRough)" style="mix-blend-mode:multiply" fill="url(#dripGrad)">
    <path d="M1180 300 q6 180 -2 360 q-3 60 4 120 l10 0 q4 -70 2 -130 q-4 -170 4 -350 z"/>
    <path d="M1236 320 q4 120 -1 240 l7 0 q3 -120 2 -240 z" opacity="0.8"/>
    <path d="M1300 310 q5 200 0 420 l9 0 q2 -220 0 -420 z" opacity="0.7"/>
    <path d="M300 300 q5 150 -3 320 l9 0 q4 -170 2 -320 z" opacity="0.75"/>
    <path d="M360 290 q3 90 0 190 l6 0 q2 -100 1 -190 z" opacity="0.6"/>
    <path d="M1540 450 q6 220 -2 470 l10 0 q4 -250 1 -470 z" opacity="0.65"/>
  </g>

  <!-- 霉斑（墙角与水痕周围聚集） -->
  <g style="mix-blend-mode:multiply" opacity="0.85">
    <rect x="0" y="0" width="420" height="300" fill="#fff" filter="url(#moldSpeck)" opacity="0.9"/>
    <rect x="1500" y="0" width="420" height="260" fill="#fff" filter="url(#moldSpeck)" opacity="0.8"/>
    <rect x="1120" y="200" width="260" height="220" fill="#fff" filter="url(#moldSpeck)" opacity="0.6"/>
    <rect x="0" y="820" width="360" height="260" fill="#fff" filter="url(#moldSpeck)" opacity="0.7"/>
    <rect x="1600" y="860" width="320" height="220" fill="#fff" filter="url(#moldSpeck)" opacity="0.6"/>
  </g>
  <g fill="#2b3320" opacity="0.35" filter="url(#stainBlur)">
    <circle cx="90" cy="70" r="40"/>
    <circle cx="160" cy="40" r="26"/>
    <circle cx="1840" cy="60" r="46"/>
    <circle cx="1780" cy="110" r="22"/>
    <circle cx="70" cy="1010" r="50"/>
  </g>

  <!-- 暗红残痕（少量、点到为止） -->
  <g filter="url(#bloodEdge)" style="mix-blend-mode:multiply">
    <!-- 手指拖痕 -->
    <g fill="#4a1410" opacity="0.38">
      <path d="M1412 560 q30 40 26 130 q-2 30 -6 52 l-7 0 q4 -60 -2 -110 q-6 -40 -18 -66 z"/>
      <path d="M1432 556 q26 44 22 120 l-6 0 q2 -60 -8 -100 q-6 -14 -14 -20 z" opacity="0.8"/>
      <path d="M1452 566 q18 30 16 80 l-5 0 q0 -40 -6 -62 z" opacity="0.65"/>
    </g>
    <!-- 细小滴落 -->
    <g fill="#3d100d" opacity="0.42">
      <path d="M1438 742 q2 26 0 48 q-3 6 -5 0 q-2 -22 1 -48 z"/>
      <circle cx="1436" cy="792" r="2.6"/>
    </g>
    <!-- 远处一抹旧痕 -->
    <path d="M640 690 q40 -12 90 4 q-30 10 -56 8 q-20 -2 -34 -12 z" fill="#3a130f" opacity="0.28"/>
