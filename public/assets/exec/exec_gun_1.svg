  <!-- ===== 末段：玻璃上的湿血 ===== -->
  <filter id="wetBloodEnd" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation="0.6" result="b"/>
    <feSpecularLighting in="b" surfaceScale="4" specularConstant="0.9" specularExponent="28" lighting-color="#ffd9d9" result="spec">
      <feDistantLight azimuth="235" elevation="55"/>
    </feSpecularLighting>
    <feComposite in="spec" in2="b" operator="in" result="specIn"/>
    <feComposite in="b" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="0.55" k4="0"/>
  </filter>

  <filter id="stopMotionJitter" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="1" seed="1" result="j">
      <animate attributeName="seed" values="1;4;9;2;7;5" dur="0.5s" calcMode="discrete" repeatCount="indefinite"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="j" scale="5"/>
  </filter>

  <filter id="grainEnd" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" stitchTiles="stitch" result="g">
      <animate attributeName="seed" values="3;11;6;14;8" dur="0.42s" calcMode="discrete" repeatCount="indefinite"/>
    </feTurbulence>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="table" tableValues="0 0.22"/>
    </feComponentTransfer>
  </filter>

  <filter id="mistBlurEnd" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.02" numOctaves="4" seed="21" result="m"/>
    <feDisplacementMap in="SourceGraphic" in2="m" scale="60"/>
    <feGaussianBlur stdDeviation="18"/>
  </filter>

  <radialGradient id="bloodDropEnd" cx="40%" cy="35%" r="70%">
    <stop offset="0" stop-color="#b3121a"/>
    <stop offset="0.55" stop-color="#6e0409"/>
    <stop offset="1" stop-color="#2a0003"/>
  </radialGradient>
  <radialGradient id="vignetteEnd" cx="50%" cy="50%" r="72%">
    <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
    <stop offset="0.85" stop-color="#0a0002" stop-opacity="0.6"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.95"/>
  </radialGradient>
  <linearGradient id="mistGradEnd" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#5a0008" stop-opacity="0.55"/>
    <stop offset="0.6" stop-color="#3a0006" stop-opacity="0.2"/>
    <stop offset="1" stop-color="#1a0003" stop-opacity="0"/>
  </linearGradient>

  <!-- 玻璃湿血：掌印抹痕 + 下淌血线（定格抖动） -->
  <g id="glassBlood" filter="url(#stopMotionJitter)">
    <g filter="url(#wetBloodEnd)" fill="url(#bloodDropEnd)" opacity="0.92">
      <!-- 抹痕 -->
      <path d="M520 120 C560 110 610 130 640 160 C660 190 650 230 620 240 C590 250 560 230 540 210 C515 185 495 140 520 120 Z"/>
      <path d="M548 128 C552 100 560 80 572 78 C582 80 578 110 570 132 Z"/>
      <path d="M580 124 C590 92 602 70 614 72 C622 78 612 108 600 134 Z"/>
      <path d="M610 138 C624 112 640 98 650 102 C656 110 640 134 626 152 Z"/>
      <path d="M634 170 C652 156 670 152 674 160 C674 170 656 182 640 190 Z"/>
      <!-- 下淌血线 -->
      <path d="M560 235 C558 290 562 340 556 400 C555 412 566 414 567 402 C570 340 566 290 570 238 Z">
        <animate attributeName="d" dur="4s" calcMode="discrete" repeatCount="indefinite"
          values="M560 235 C558 290 562 340 556 400 C555 412 566 414 567 402 C570 340 566 290 570 238 Z;
                  M560 235 C558 300 562 360 556 440 C555 452 566 454 567 442 C570 360 566 300 570 238 Z;
                  M560 235 C558 310 562 380 556 480 C555 492 566 494 567 482 C570 380 566 310 570 238 Z"/>
      </path>
      <path d="M600 245 C599 280 603 310 598 350 C597 360 607 361 608 351 C611 312 607 280 609 246 Z">
        <animate attributeName="d" dur="5s" calcMode="discrete" repeatCount="indefinite"
          values="M600 245 C599 280 603 310 598 350 C597 360 607 361 608 351 C611 312 607 280 609 246 Z;
                  M600 245 C599 290 603 330 598 390 C597 400 607 401 608 391 C611 332 607 290 609 246 Z"/>
      </path>
      <!-- 飞溅点 -->
      <circle cx="480" cy="160" r="6"/>
      <circle cx="470" cy="190" r="3.5"/>
      <circle cx="690" cy="210" r="5"/>
      <circle cx="705" cy="240" r="2.5"/>
      <circle cx="505" cy="260" r="4"/>
      <ellipse cx="660" cy="290" rx="3" ry="7"/>
    </g>
    <!-- 高光湿润反光 -->
    <g fill="#ffe6e6" opacity="0.35">
      <ellipse cx="560" cy="150" rx="14" ry="5" transform="rotate(-20 560 150)"/>
      <ellipse cx="562" cy="300" rx="1.5" ry="10"/>
      <circle cx="478" cy="157" r="1.6"/>
