    <line x1="215" y1="160" x2="207" y2="200"/>
    <line x1="250" y1="110" x2="242" y2="150"/>
    <line x1="290" y1="220" x2="282" y2="260"/>
    <line x1="330" y1="130" x2="322" y2="170"/>
