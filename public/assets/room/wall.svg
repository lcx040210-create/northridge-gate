  <!-- 水珠高光 -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="233" cy="271" r="0.9"/>
    <circle cx="547" cy="277" r="0.8"/>
    <circle cx="386" cy="271" r="0.6"/>
  </g>

  <!-- 玻璃反光 -->
  <path d="M140 90 L230 90 L130 300 L120 300 L120 130 Z" fill="url(#glassSheen)" opacity="0.28"/>
  <path d="M250 90 L275 90 L150 360 L138 360 Z" fill="url(#glassSheen)" opacity="0.15"/>
  <path d="M620 510 L680 400 L680 440 L650 510 Z" fill="url(#glassSheen)" opacity="0.12"/>

  <!-- 裂纹：撞击点 + 放射 + 分叉 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#e8eef5" stroke-width="1.1" opacity="0.75">
      <path d="M560 200 L592 168 L610 140 L640 118"/>
      <path d="M560 200 L605 212 L648 206 L680 214"/>
      <path d="M560 200 L574 250 L566 300 L585 345"/>
      <path d="M560 200 L518 228 L480 236 L455 262"/>
      <path d="M560 200 L540 160 L545 120 L530 90"/>
