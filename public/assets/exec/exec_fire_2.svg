    <path d="M922 302 C950 288 998 298 1003 326" fill="none" stroke="#2a0805" stroke-width="5" stroke-linecap="round"/>
    <path d="M630 280 L648 300 L640 318 M660 272 L668 295 L690 305 M940 318 L958 335 M972 310 L978 340 L995 350"
          fill="none" stroke="#1a0402" stroke-width="1.5"/>
    <!-- 沸腾气泡 -->
    <g fill="none" stroke="#c0201a" stroke-width="1.5">
      <circle cx="645" cy="295" r="4"><animate attributeName="r" values="1;6;0" dur="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="672" cy="312" r="3"><animate attributeName="r" values="0;5;0" dur="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="955" cy="330" r="4"><animate attributeName="r" values="2;7;0" dur="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="985" cy="345" r="3"><animate attributeName="r" values="0;4;0" dur="0.7s" repeatCount="indefinite"/></circle>
    </g>
    <!-- 飞溅血点 -->
    <g fill="url(#bloodGrad)">
      <circle cx="720" cy="240" r="5"/></g></g></g>```svg
  <!-- ===== 末段：火光 / 黑烟 / 焦黑组织 / 定格 / 血雾 / 颗粒 / 暗角 ===== -->

  <!-- 局部滤镜（非 defs，可直接放置于 SVG 内任意位置） -->
  <filter id="fxFireBlur" x="-50%" y="-50%" width="200%" height="200%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018 0.045" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="38" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation="6"/>
  </filter>
  <filter id="fxSmoke" x="-50%" y="-50%" width="200%" height="200%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.02" numOctaves="4" seed="21" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="90" xChannelSelector="R" yChannelSelector="B" result="d"/>
    <feGaussianBlur in="d" stdDeviation="14"/>
  </filter>
  <filter id="fxChar" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="turbulence" baseFrequency="0.09" numOctaves="3" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="fxMist" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="44" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.02  0 0 0 0 0.03  0 0 0 1.4 -0.55" result="m"/>
    <feComposite in="m" in2="SourceGraphic" operator="in"/>
    <feGaussianBlur stdDeviation="3"/>
  </filter>
  <filter id="fxGrain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="9" stitchTiles="stitch" result="g"/>
    <feColorMatrix in="g" type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="table" tableValues="0 0.22"/>
    </feComponentTransfer>
  </filter>
  <radialGradient id="gFireCore" cx="50%" cy="70%" r="60%">
    <stop offset="0" stop-color="#fff3c4" stop-opacity="0.95"/>
    <stop offset="0.25" stop-color="#ffb13b" stop-opacity="0.9"/>
    <stop offset="0.55" stop-color="#e2521a" stop-opacity="0.7"/>
    <stop offset="1" stop-color="#5a0f05" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="gGlow" cx="50%" cy="80%" r="70%">
    <stop offset="0" stop-color="#ff7a1f" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#ff7a1f" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="gVignette" cx="50%" cy="50%" r="72%">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="0.85" stop-color="#050101" stop-opacity="0.6"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.92"/>
  </radialGradient>
  <linearGradient id="gCharEdge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1a0d08"/>
    <stop offset="0.7" stop-color="#0b0605"/>
    <stop offset="1" stop-color="#ff6a1a" stop-opacity="0.85"/>
  </linearGradient>

  <!-- 1. 橙色火光：环境泛光 + 火舌 -->
  <g id="fire" style="mix-blend-mode:screen">
    <rect x="0" y="0" width="100%" height="100%" fill="url(#gGlow)"/>
    <g filter="url(#fxFireBlur)">
