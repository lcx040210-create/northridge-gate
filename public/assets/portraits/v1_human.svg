  <!-- ===== 软布制服帽 ===== -->
  <linearGradient id="capCloth" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5b6448"/>
    <stop offset="0.55" stop-color="#4a5239"/>
    <stop offset="1" stop-color="#363c2a"/>
  </linearGradient>
  <linearGradient id="capBrim" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2f3425"/>
    <stop offset="1" stop-color="#1e2218"/>
  </linearGradient>
  <filter id="clothSoft" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9 0.35" numOctaves="2" seed="7" result="weave"/>
    <feColorMatrix in="weave" type="saturate" values="0" result="weaveGray"/>
    <feComposite in="weaveGray" in2="SourceAlpha" operator="in" result="weaveMask"/>
    <feBlend in="SourceGraphic" in2="weaveMask" mode="multiply" result="woven"/>
    <feGaussianBlur in="woven" stdDeviation="0.4"/>
  </filter>

  <g id="cap" filter="url(#clothSoft)">
