    <stop offset="70%" stop-color="#5e0b10"/>
    <stop offset="100%" stop-color="#2b0306"/>
  </radialGradient>
  <radialGradient id="gTissue" cx="35%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#efe2d6"/>
    <stop offset="55%" stop-color="#cdb3a4"/>
    <stop offset="100%" stop-color="#7d5249"/>
