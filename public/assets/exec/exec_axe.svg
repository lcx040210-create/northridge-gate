  <!-- ===== 末段：玻璃血雾 / 组织块 / 定格 / 氛围层 ===== -->

  <filter id="fxSplatBlur" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation="1.2"/>
  </filter>
  <filter id="fxMist" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <filter id="fxTissue" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="turbulence" baseFrequency="0.09" numOctaves="2" seed="3" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="6"/>
  </filter>
  <filter id="fxGrain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="11" stitchTiles="stitch" result="g"/>
    <feColorMatrix in="g" type="matrix"
      values="0 0 0 0 0.5
              0 0 0 0 0.45
              0 0 0 0 0.42
              0 0 0 0.55 0"/>
  </filter>
  <radialGradient id="gVignette" cx="50%" cy="50%" r="72%">
    <stop offset="55%" stop-color="#000" stop-opacity="0"/>
    <stop offset="85%" stop-color="#050102" stop-opacity="0.65"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.95"/>
  </radialGradient>
  <radialGradient id="gRedMist" cx="48%" cy="44%" r="60%">
